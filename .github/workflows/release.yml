name: Release

# Nightly prereleases come from main and stable releases from release/X.Y branches.
# See docs/releases.md.

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Let every push to a release branch finish so no patch release is skipped.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Determine version and channel
        id: version
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          case "$GITHUB_REF" in
            refs/heads/release/*)
              line="${GITHUB_REF#refs/heads/release/}"
              case "$line" in
                *.*.*) echo "Name release branches release/<major>.<minor>, not release/$line." >&2; exit 1 ;;
              esac
              case "$manifest" in
                "$line".*) ;;
                *) echo "Cargo.toml version $manifest does not belong to release/$line." >&2; exit 1 ;;
              esac
              channel=stable
              version="$manifest"
              ;;
            refs/heads/main)
              channel=nightly
              version="$manifest-nightly.$GITHUB_RUN_NUMBER"
              ;;
            *)
              channel=none
              version="$manifest-dev.$GITHUB_RUN_NUMBER"
              ;;
          esac
          echo "Building $version ($channel)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NIGHTSHIFT_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 links against an older glibc, so the binaries run on more distributions.
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-22.04-arm
          - name: macos-aarch64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sh scripts/install-linux-deps.sh

      # The Build workflow lints and tests on macOS only.
      - name: Lint and test on Linux
        if: runner.os == 'Linux'
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build Debian package
        if: runner.os == 'Linux'
        run: sh scripts/bundle-deb.sh

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: sh scripts/bundle-dmg.sh

      - name: Verify package contents and version
        run: |
          case "${{ runner.os }}" in
            Linux)
              package=target/release/nightshift-${{ matrix.name }}.deb
              dpkg-deb --info "$package"
              dpkg-deb --contents "$package" | grep -E '\./usr/bin/nightshift$'
              dpkg-deb --contents "$package" | grep -E '\./usr/share/applications/dev\.nightshift\.app\.desktop$'
              dpkg-deb --contents "$package" | grep -E '\./usr/share/pixmaps/dev\.nightshift\.app\.png$'
              test "$(dpkg-deb --field "$package" Version)" = "$NIGHTSHIFT_VERSION"
              sudo apt-get install --yes "./$package"
              binary=/usr/bin/nightshift
              ;;
            macOS)
              image=target/release/nightshift-${{ matrix.name }}.dmg
              hdiutil verify "$image"
              mount="$(mktemp -d)"
              hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$image"
              test -L "$mount/Applications"
              test -s "$mount/Nightshift.app/Contents/Resources/Nightshift.icns"
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$mount/Nightshift.app/Contents/Info.plist")" = Nightshift
              codesign --verify --strict "$mount/Nightshift.app"
              test "$(cat "$mount/Nightshift.app/Contents/Resources/VERSION")" = "$NIGHTSHIFT_VERSION"
              cp -R "$mount/Nightshift.app" "$RUNNER_TEMP/Nightshift.app"
              hdiutil detach "$mount"
              binary="$RUNNER_TEMP/Nightshift.app/Contents/MacOS/nightshift"
              ;;
          esac
          test "$("$binary" --version)" = "nightshift $NIGHTSHIFT_VERSION"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightshift-${{ matrix.name }}
          path: |
            target/release/nightshift-*.deb
            target/release/nightshift-*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.version.outputs.channel }} release
    needs: [version, bundle]
    if: github.event_name == 'push' && needs.version.outputs.channel != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightshift-*
          path: dist
          merge-multiple: true

      - name: Add checksums
        working-directory: dist
        run: |
          sha256sum nightshift-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already released. Bump the patch version in Cargo.toml to publish a fix."
            exit 0
          fi
          prerelease=""
          [ "$CHANNEL" = nightly ] && prerelease="--prerelease"
          notes="Download nightshift-macos-aarch64.dmg for Apple silicon Macs, nightshift-macos-x86_64.dmg for Intel Macs, or the nightshift-linux-<arch>.deb package for Debian and Ubuntu. See docs/releases.md for first-launch steps on macOS."
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Nightshift $VERSION" \
            --notes "$notes" --generate-notes $prerelease
