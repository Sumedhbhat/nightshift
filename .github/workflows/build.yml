name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check formatting
        run: cargo fmt --all --check

  build:
    name: Lint, test, and package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 links against an older glibc, so release binaries run on more distributions.
          - name: linux-x86_64
            os: ubuntu-22.04
            bundle: sh scripts/bundle-linux.sh
            artifact: target/release/nightshift-linux-x86_64.tar.gz
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            bundle: sh scripts/bundle-linux.sh
            artifact: target/release/nightshift-linux-aarch64.tar.gz
          - name: macos-aarch64
            os: macos-15
            bundle: sh scripts/bundle.sh --release
            artifact: target/release/Nightshift.app
          - name: macos-x86_64
            os: macos-15-intel
            bundle: sh scripts/bundle.sh --release
            artifact: target/release/Nightshift.app
          - name: windows-x86_64
            os: windows-2022
            bundle: pwsh scripts/bundle-windows.ps1
            artifact: target/release/nightshift-windows-x86_64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sh scripts/install-linux-deps.sh

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          git --version

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release bundle
        run: ${{ matrix.bundle }}

      - name: Verify bundle contents
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)
              tar -tzf "${{ matrix.artifact }}" | grep -E '/bin/nightshift$'
              tar -tzf "${{ matrix.artifact }}" | grep -E '/dev\.nightshift\.app\.desktop$'
              ;;
            macOS)
              test -x "${{ matrix.artifact }}/Contents/MacOS/nightshift"
              test -f "${{ matrix.artifact }}/Contents/Info.plist"
              ;;
            Windows)
              unzip -l "${{ matrix.artifact }}" | grep -E 'nightshift\.exe$'
              ;;
          esac

      - name: Package macOS bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent target/release/Nightshift.app target/release/nightshift-${{ matrix.name }}.zip

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightshift-${{ matrix.name }}
          path: |
            target/release/nightshift-*.tar.gz
            target/release/nightshift-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [format, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightshift-*
          path: dist
          merge-multiple: true

      - name: Add installer and checksums
        working-directory: dist
        run: |
          cp ../scripts/install.sh install.sh
          sha256sum nightshift-* install.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Nightshift $version"

      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        run: |
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
          notes="Latest build of main at $GITHUB_SHA. Replaced on every push to main.

          Install with: \`gh release download nightly -R $GITHUB_REPOSITORY -p install.sh -O - | sh\`"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightshift nightly" --notes "$notes"
            gh release upload nightly dist/* --clobber
          else
            gh release create nightly dist/* --verify-tag --prerelease --title "Nightshift nightly" --notes "$notes"
          fi
