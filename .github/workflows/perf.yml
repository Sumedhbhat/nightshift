name: Performance

# Runs the release-build performance scenario on a clean macOS runner.
# Push a branch named perf/<anything> to run it; results are uploaded as an artifact.
# See docs/foundation-implementation.md.

on:
  push:
    branches: ["perf/**"]
  workflow_dispatch:
    inputs:
      seconds:
        description: Scenario length in seconds
        default: "600"

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Describe machine
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          system_profiler SPDisplaysDataType | sed -n '1,30p'

      - name: Build release binary
        run: cargo build --locked --release

      - name: Run performance scenario
        run: sh scripts/perf.sh target/perf "${{ inputs.seconds || '600' }}" 10

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-${{ matrix.os }}
          path: target/perf
          if-no-files-found: warn
          retention-days: 30
