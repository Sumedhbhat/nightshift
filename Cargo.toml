[package]
name = "nightshift"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "5a9b9558db01a6b906cec2fb70a797affdc58cdd", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "5a9b9558db01a6b906cec2fb70a797affdc58cdd", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "process", "io-util", "net"] }

unicode-segmentation = "1.13.3"

[dev-dependencies]
tempfile = "3"
